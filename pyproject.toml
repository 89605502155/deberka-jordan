[project]
name = "jordanplan-deberka"
version = "0.1.0"
description = "Reallocation plans for a shared resource by the Hahn-Jordan decomposition: least-volume netting, safe two-phase execution, oscillation index and dead band choice (KVM memory ballooning and beyond)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrey Ferubko" }]
requires-python = ">=3.11"
dependencies = []
keywords = [
    "signed measure", "Jordan decomposition", "Hahn decomposition", "resource allocation",
    "memory ballooning", "KVM", "libvirt", "virtual machines", "netting", "dead band",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: System :: Distributed Computing",
    "Topic :: System :: Operating System",
    "Typing :: Typed",
]

[project.optional-dependencies]
kvm = ["libvirt-python>=8.0"]

[project.scripts]
jordanplan = "jordanplan.cli:main"

# [project.urls] - add Homepage / Repository after publishing on GitHub

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "jordanplan"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--doctest-modules", "--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/jordanplan"]

[[tool.mypy.overrides]]
module = ["libvirt"]
ignore_missing_imports = true
